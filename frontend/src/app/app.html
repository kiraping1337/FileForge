<main class="page">
  <header class="masthead">
    <h1 class="wordmark">FileForge</h1>
    <p class="lede">
      Convert images, audio and video between common formats.
      Files are kept on the server only for a short time and then deleted.
    </p>
  </header>

  <app-upload-panel />

  @if (store.jobs().length > 0) {
    <section class="jobs" aria-labelledby="jobs-heading">
      <h2 id="jobs-heading" class="jobs-heading">Your files</h2>
      <p class="jobs-note">Keep this tab open: closing it loses access to these files.</p>

      <ul class="job-list">
        @for (job of store.jobs(); track job.id) {
          <li>
            <app-job-card [job]="job" />
          </li>
        }
      </ul>
    </section>
  }
</main>
