# The single entry point: the Angular app on /, the API on /api. For the browser it is one site,
# so the API needs no CORS, exactly like `ng serve` with its proxy in development.
server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;

    # A little above Conversions:MaxFileSizeBytes (200 MB). nginx's default is 1 MB:
    # without this, every bigger upload would get nginx's 413 instead of reaching the API.
    client_max_body_size 210m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://api:8080;

        # The real client IP for the rate limiter; the API trusts these headers
        # (ASPNETCORE_FORWARDEDHEADERS_ENABLED) because it is reachable only through nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight to the API instead of first writing 200 MB to nginx's disk,
        # so the upload progress in the browser matches what the API really receives.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
